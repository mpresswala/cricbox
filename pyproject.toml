[project]
name = "cricbox"
version = "0.1.2"
description = "Django project for cricket match statistics, reports, player, venue and opposition"
authors = [{ name = "mufaddal", email = "muffizone@gmail.com" }]
maintainers = [{ name = "mufaddal", email = "muffizone@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["cricket", "django"]
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "django-tables2>=3.0",
    "django-filter>=25.1",
    "django-bootstrap4>=26.1",
    "django-unfold>=0.101.0",
    "sentry-sdk>=2.0",
]

[project.urls]
Homepage = "https://github.com/muffizone/cricbox"
Repository = "https://github.com/muffizone/cricbox"

# Production database drivers. Installed only when needed:
#   uv sync --extra mysql
# Local development uses SQLite (cricbox.settings_local) and needs neither.
[project.optional-dependencies]
mysql = [
    "mysqlclient>=2.2",
    "mysql-connector-python>=9.0",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "isort>=5.13",
]

# cricbox is an application, not a distributable package.
[tool.uv]
package = false

[tool.isort]
profile = 'black'
skip_gitignore = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'FIRSTPARTY', 'LOCALFOLDER', "DJANGO", "DJANGO_APPS"]
known_django = ["django"]
known_django_apps = ["django_tables2", "django_filters"]
known_first_party = ["bowler", "batsman", "match", "match_statistics", "cricbox", "home", "opposition", "player", "venue"]
import_heading_stdlib = "Standard imports"
import_heading_django = "Django imports"
import_heading_django_apps = "Django third party apps"
import_heading_firstparty = "Cricbox imports"
import_heading_thirdparty = "Third-party imports"
skip_glob = "**/migrations/*"

[tool.black]
line-length = 119
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.venv
    | build
    | dist
    | migrations
  )/
)
'''
