[project]
name = "cricbox"
version = "0.1.2"
description = "Django project for cricket match statistics, reports, player, venue and opposition"
authors = [{ name = "mufaddal", email = "muffizone@gmail.com" }]
maintainers = [{ name = "mufaddal", email = "muffizone@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["cricket", "django"]
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "django-tables2>=3.0",
    "django-filter>=25.1",
    "django-bootstrap4>=26.1",
    "django-unfold>=0.101.0",
    "sentry-sdk>=2.0",
]

[project.urls]
Homepage = "https://github.com/muffizone/cricbox"
Repository = "https://github.com/muffizone/cricbox"

# Production database drivers. Installed only when needed:
#   uv sync --extra mysql
# Local development uses SQLite (cricbox.settings_local) and needs neither.
[project.optional-dependencies]
mysql = [
    "mysqlclient>=2.2",
    "mysql-connector-python>=9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

# cricbox is an application, not a distributable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I) and mccabe complexity (C90),
# mirroring the previous flake8 + isort setup.
select = ["E", "W", "F", "I", "C90"]
# E203 (whitespace before punctuation) conflicts with the formatter, as W503
# did under flake8.
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = [
    "bowler", "batsman", "match", "match_statistics",
    "cricbox", "home", "opposition", "player", "venue",
]
section-order = [
    "future", "standard-library", "third-party",
    "first-party", "local-folder", "django", "django-apps",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"django-apps" = ["django_tables2", "django_filters"]
