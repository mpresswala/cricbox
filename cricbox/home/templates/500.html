<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>London Fields CC — Something went wrong</title>
    <style>
        /* Inlined on purpose: this page must render even if static files or
           other templates are the reason the request failed. */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1f2937;
            background: #f9fafb;
        }
        header {
            background: #0f172a;
            color: #fff;
            padding: 1rem 1.5rem;
            font-weight: 700;
            font-size: 1.1rem;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .card {
            max-width: 32rem;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #4b5563;
            line-height: 1.5;
        }
        a.button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.4rem;
            background: #0f172a;
            color: #fff;
            text-decoration: none;
            border-radius: 0.4rem;
            font-weight: 600;
        }
        a.button:hover {
            background: #1e293b;
        }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <header>London Fields CC</header>
    <main>
        <div class="card">
            <h1>This page hit a snag</h1>
            <p>
                Something went wrong loading this page — the rest of the site is
                unaffected, so try the link below or come back in a bit.
                We've already been notified and are looking into it.
            </p>
            <a class="button" href="/">Back to the homepage</a>
        </div>
    </main>
    <footer>&copy; London Fields Cricket Club</footer>
</body>
</html>
