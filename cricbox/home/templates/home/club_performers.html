{% extends "home/base.html" %}
{% load render_table from django_tables2 %}
{% block content %}
<section class="page-header">
    <div class="container-page py-10">
        <h1 class="text-3xl font-bold sm:text-4xl">Notable Performances</h1>
    </div>
</section>

<div class="container-page py-8" x-data="{ tab: 0 }">
    <div class="mb-6 flex flex-wrap border-b border-ink-200">
        <button @click="tab=0" :class="tab===0 ? 'tab-btn tab-btn-active' : 'tab-btn'">50s</button>
        <button @click="tab=1" :class="tab===1 ? 'tab-btn tab-btn-active' : 'tab-btn'">100s</button>
        <button @click="tab=2" :class="tab===2 ? 'tab-btn tab-btn-active' : 'tab-btn'">5 Wickets</button>
        <button @click="tab=3" :class="tab===3 ? 'tab-btn tab-btn-active' : 'tab-btn'">Top Scorer</button>
        <button @click="tab=4" :class="tab===4 ? 'tab-btn tab-btn-active' : 'tab-btn'">Top Wicket Taker</button>
    </div>
    <div x-show="tab===0">{% render_table tables.0 %}</div>
    <div x-show="tab===1" x-cloak>{% render_table tables.1 %}</div>
    <div x-show="tab===2" x-cloak>{% render_table tables.2 %}</div>
    <div x-show="tab===3" x-cloak>{% render_table tables.3 %}</div>
    <div x-show="tab===4" x-cloak>{% render_table tables.4 %}</div>
</div>
{% endblock content %}
