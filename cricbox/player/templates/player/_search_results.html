{% if results %}
    {% for p in results %}
    <a href="{% url 'player-profile' p.id %}"
       class="block px-4 py-2 text-sm hover:bg-brand-50 hover:text-brand-700 dark:hover:bg-ink-800 dark:hover:text-brand-200">
        {{ p.full_name }}
    </a>
    {% endfor %}
{% elif query %}
    <p class="px-4 py-3 text-sm text-ink-500 dark:text-ink-400">No players found.</p>
{% endif %}
