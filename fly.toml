# fly.toml app configuration file generated for cricbox on 2026-07-31T19:39:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cricbox'
primary_region = 'lhr'
console_command = '.venv/bin/python cricbox/manage.py shell'

[build]

[env]
DJANGO_SETTINGS_MODULE = 'cricbox.settings_fly'
PORT = '8000'
# 2 workers — see docker-entrypoint.sh, which reads this (default 1)
# rather than hardcoding a worker count, since the same entrypoint also
# runs on Render's 0.5-CPU Starter plan. Machine is shared-cpu-6x below;
# left at 2 workers for now even though there's more CPU allowance
# available — bump this if the site still needs more headroom.
GUNICORN_WORKERS = '3'

[[mounts]]
source = 'cricbox_data'
destination = '/var/data'

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

# Health check removed 2026-08-01. Fly's service-level check is all-or-
# nothing: a single failure pulls the Machine from routing and 503s every
# visitor (confirmed the same day — ~44% of requests during an incident
# were origin 503s from exactly this), and per Fly's own docs a failing
# check never triggers an automatic restart anyway ("Machines won't
# automatically restart or stop due to failing health checks, this needs
# to be done manually"). With only one Machine running
# (min_machines_running = 1, no redundancy), the check bought no failover
# benefit — its only effect was the 503-everyone behavior. Without it, a
# bad moment now degrades (some requests slow/hang) instead of blocking
# (every request instantly 503'd), which is the better failure mode for
# a single-Machine deployment. /healthz (home/views.py + urls.py) and
# HealthCheckMiddleware are left in place in case this needs revisiting.

[[vm]]
# Bumped from shared-cpu-2x to shared-cpu-6x on 2026-08-02 after CPU burst
# credits were repeatedly exhausted under load, triggering platform
# throttling and the app becoming unresponsive (confirmed via Fly's
# Instance Load/CPU metrics — utilization draining the credit balance,
# then a throttle-driven iowait spike and hang). Still a shared/bursty
# CPU tier under the hood (same credit-then-throttle model), just a much
# larger allowance and baseline — not a switch to non-throttled dedicated
# CPU (that would be a `performance-*` size instead).
size = 'shared-cpu-4x'
memory = '1.5gb'

[[statics]]
guest_path = '/app/cricbox/staticfiles'
url_prefix = '/static/'
