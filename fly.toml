# Fly.io app configuration for cricbox.
#
# First-time setup (see README.md "Hosting on Fly.io" for the full walkthrough):
#   fly apps create cricbox              # or let `fly launch` create this file
#   fly volumes create cricbox_data --region lhr --size 1
#   fly secrets set DJANGO_SECRET_KEY=...
#   fly deploy
#
# Redeploy any time with: fly deploy

app = "cricbox"        # must match what you ran `fly apps create` with
primary_region = "lhr" # London — closest to the club; change freely

[build]

[env]
DJANGO_SETTINGS_MODULE = "cricbox.settings_fly"
PORT = "8000"
# DJANGO_DATA_DIR is intentionally left unset — it defaults to /var/data,
# matching the volume mount below and the Render setup, so
# docker-entrypoint.sh and litestream.yml work unchanged on both platforms.

# Persistent disk for the SQLite DB + media, same role as Render's disk.
# Create it once with: fly volumes create cricbox_data --region lhr --size 1
[[mounts]]
source = "cricbox_data"
destination = "/var/data"

[http_service]
internal_port = 8000
force_https = true
# This is a low-traffic, SQLite-backed app on a single Machine — keep it
# always on rather than scale-to-zero, so there's no cold-start latency
# (Litestream replication also expects the process to stay up).
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "30s"
interval = "15s"
method = "GET"
timeout = "5s"
path = "/healthz"
# Django has SECURE_SSL_REDIRECT on, so a plain-HTTP check would get a
# 301 (which Fly's checker treats as a failure — it doesn't follow
# redirects). This header tells Django the request is already HTTPS.
[http_service.checks.headers]
X-Forwarded-Proto = "https"

# 2 shared vCPUs / 1GB RAM — more CPU and RAM than the Render Starter plan
# (0.5 CPU / 512MB) for less money. Adjust with `fly scale vm` later if needed.
[[vm]]
size = "shared-cpu-2x"
memory = "1gb"
