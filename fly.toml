# fly.toml app configuration file generated for cricbox on 2026-07-31T19:39:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cricbox'
primary_region = 'lhr'
console_command = '.venv/bin/python cricbox/manage.py shell'

[build]

[env]
DJANGO_SETTINGS_MODULE = 'cricbox.settings_fly'
PORT = '8000'
# 2 workers now that this app is on a shared-cpu-2x (2 vCPU) Machine — see
# docker-entrypoint.sh, which reads this (default 1) rather than hardcoding
# a worker count, since the same entrypoint also runs on Render's 0.5-CPU
# Starter plan.
GUNICORN_WORKERS = '2'

[[mounts]]
source = 'cricbox_data'
destination = '/var/data'

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

# Health check removed 2026-08-01. Fly's service-level check is all-or-
# nothing: a single failure pulls the Machine from routing and 503s every
# visitor (confirmed the same day — ~44% of requests during an incident
# were origin 503s from exactly this), and per Fly's own docs a failing
# check never triggers an automatic restart anyway ("Machines won't
# automatically restart or stop due to failing health checks, this needs
# to be done manually"). With only one Machine running
# (min_machines_running = 1, no redundancy), the check bought no failover
# benefit — its only effect was the 503-everyone behavior. Without it, a
# bad moment now degrades (some requests slow/hang) instead of blocking
# (every request instantly 503'd), which is the better failure mode for
# a single-Machine deployment. /healthz (home/views.py + urls.py) and
# HealthCheckMiddleware are left in place in case this needs revisiting.

[[vm]]
size = 'shared-cpu-2x'
memory = '1gb'

[[statics]]
guest_path = '/app/cricbox/staticfiles'
url_prefix = '/static/'
