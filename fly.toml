# fly.toml app configuration file generated for cricbox on 2026-07-31T19:50:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cricbox'
primary_region = 'lhr'
console_command = '/code/manage.py shell'

[build]

[env]
  DJANGO_SETTINGS_MODULE = 'cricbox.settings_fly'
  PORT = '8000'

[[mounts]]
  source = 'cricbox_data'
  destination = '/var/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
