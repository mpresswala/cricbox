# fly.toml app configuration file generated for cricbox on 2026-07-31T19:39:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cricbox'
primary_region = 'lhr'
console_command = '.venv/bin/python cricbox/manage.py shell'

[build]

[env]
  DJANGO_SETTINGS_MODULE = 'cricbox.settings_fly'
  PORT = '8000'
  # 2 workers now that this app is on a shared-cpu-2x (2 vCPU) Machine — see
  # docker-entrypoint.sh, which reads this (default 1) rather than hardcoding
  # a worker count, since the same entrypoint also runs on Render's 0.5-CPU
  # Starter plan.
  GUNICORN_WORKERS = '2'

[[mounts]]
  source = 'cricbox_data'
  destination = '/var/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'

[[statics]]
  guest_path = '/app/cricbox/staticfiles'
  url_prefix = '/static/'
